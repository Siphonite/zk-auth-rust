[package]
name = "zk-auth-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-std = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-groth16 = "0.4"
ark-bn254 = "0.4"
ark-snark = "0.4"
ark-crypto-primitives = { version = "0.4", features = ["crh", "r1cs", "sponge"] }
rand = "0.8"
ark-ff = "0.4"
ark-serialize = "0.4"

# CLI and serialization
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"
sha2 = "0.10"
